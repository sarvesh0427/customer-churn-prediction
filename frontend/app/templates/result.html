<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="card">

    <h1>Prediction Result</h1>

    <div class="result-box">

        <p class="prob">
            Churn Probability: {{ probability }}%
        </p>

        <p class="risk {{ risk_class }}">
            {{ risk }}
        </p>

    </div>

    <a href="/" class="btn">Try Again</a>

</div>

</body>
</html>
